[package]
name = "syncplus"
version.workspace = true
edition.workspace = true

[[bin]]
name = "syncplus"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
ksni = { version = "=0.3.6", features = ["blocking"] }
notify-rust = { version = "=4.18.0", default-features = true }
syncplus-core = { path = "../syncplus-core" }
