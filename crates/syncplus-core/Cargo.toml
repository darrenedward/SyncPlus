[package]
name = "syncplus-core"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1.1"
libc = "0.2"
sha2 = "0.10"
unicode-normalization = "0.1"
keyring = { version = "4.2", default-features = true }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
